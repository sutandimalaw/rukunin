name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to IDCloudHost VPS (with retry)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "SSH attempt ${attempt}/5..."
            if ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o BatchMode=no \
              -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" \
              'bash -s' <<'EOF'
            set -euo pipefail
            cd /var/www/rukunin

            # Prevent: "fatal: detected dubious ownership in repository"
            git config --global --add safe.directory /var/www/rukunin

            # Always deploy the exact latest commit from origin/main
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            echo "Deployed commit: $(git rev-parse --short HEAD)"

            # Preflight: Check disk space
            DISK_USAGE=$(df /var/www/rukunin | tail -1 | awk '{print $5}' | sed 's/%//')
            echo "Disk usage: ${DISK_USAGE}%"
            if [ "${DISK_USAGE}" -gt 90 ]; then
              echo "ERROR: Disk usage >90%. Aborting."
              exit 1
            fi

            # Next.js can mis-detect workspace root when multiple lockfiles exist.
            # Ensure no nested lockfile remains on the server.
            rm -f apps/web/package-lock.json || true

            # Force cleanup of any corrupted/partial node_modules installations.
            # The TAR_ENTRY_ERROR errors are often due to leftover .npm-lock files from interrupted installs.
            echo "Cleaning node_modules and npm cache..."
            rm -rf node_modules apps/web/node_modules apps/api/node_modules || true
            rm -rf .npm || true
            pkill -9 npm || true
            sleep 2

            # Ensure optionalDependencies are installed (e.g. lightningcss platform binary)
            npm config delete omit || true
            npm config set fetch-retries 5
            npm config set fetch-retry-mintimeout 20000
            npm config set fetch-retry-maxtimeout 120000
            npm cache clean --force

            # Log npm version for debugging
            echo "Node: $(node -v) | npm: $(npm -v)"

            # Use npm install instead of npm ci (more forgiving of lock/workspace mismatches on flaky networks)
            echo "Installing dependencies (this may take several minutes)..."
            npm install --include=optional 2>&1 | grep -E '(added|removed|changed|audited|packages|WARN|ERR)' || echo "npm install in progress..."

            # CRITICAL: On flaky networks, optional platform-specific binaries often silently fail to download.
            # Explicitly install the Linux x64 native binaries for lightningcss and Tailwind Oxide.
            echo "Installing platform-specific native binaries for Linux..."
            
            # Extract versions from installed packages
            LCSS_VER=$(node -p "try { require('./apps/web/node_modules/lightningcss/package.json').version } catch(e) { '' }")
            OXIDE_VER=$(node -p "try { require('./apps/web/node_modules/@tailwindcss/oxide/package.json').version } catch(e) { '' }")
            
            if [ -n "${LCSS_VER}" ]; then
              echo "Installing lightningcss-linux-x64-gnu@${LCSS_VER}..."
              npm install --no-save --include=optional "lightningcss-linux-x64-gnu@${LCSS_VER}" || \
                npm install --no-save --include=optional lightningcss-linux-x64-gnu@latest
            fi
            
            if [ -n "${OXIDE_VER}" ]; then
              echo "Installing @tailwindcss/oxide-linux-x64-gnu@${OXIDE_VER}..."
              npm install --no-save --include=optional "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VER}" || \
                npm install --no-save --include=optional @tailwindcss/oxide-linux-x64-gnu@latest
            fi

            # Verify the native .node binaries exist (not just package.json)
            echo "Verifying native binaries..."
            LCSS_BINARY="apps/web/node_modules/lightningcss/lightningcss.linux-x64-gnu.node"
            if [ ! -f "${LCSS_BINARY}" ]; then
              echo "ERROR: lightningcss native binary not found at ${LCSS_BINARY}"
              echo "Contents of apps/web/node_modules/lightningcss/:"
              ls -la apps/web/node_modules/lightningcss/ || echo "Directory not found"
              exit 1
            else
              echo "✓ lightningcss native binary found"
            fi

            # Build
            npm run build:api
            NAPI_RS_FORCE_WASI=1 npm run build:web
            npx prisma migrate deploy --schema apps/api/src/prisma/schema.prisma

            # Avoid EADDRINUSE on deploy if an old process is still holding the port
            pm2 delete rukunin-web || true
            pm2 delete rukunin-api || true

            if command -v lsof >/dev/null 2>&1; then
              kill -9 $(lsof -t -i:3000) 2>/dev/null || true
              kill -9 $(lsof -t -i:3001) 2>/dev/null || true
            elif command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
              fuser -k 3001/tcp 2>/dev/null || true
            fi

            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
          EOF
            then
              echo "Deploy succeeded."
              exit 0
            fi

            echo "SSH attempt ${attempt} failed. Retrying in ${attempt}0 seconds..."
            sleep $((attempt * 10))
          done

          echo "Deploy failed after 5 SSH attempts."
          exit 1
