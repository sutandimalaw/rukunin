name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to IDCloudHost VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/rukunin

            # Prevent: "fatal: detected dubious ownership in repository"
            git config --global --add safe.directory /var/www/rukunin

            # Always deploy the exact latest commit from origin/main
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            echo "Deployed commit: $(git rev-parse --short HEAD)"

            # Next.js can mis-detect workspace root when multiple lockfiles exist.
            # Ensure no nested lockfile remains on the server.
            rm -f apps/web/package-lock.json || true

            # Ensure optionalDependencies are installed (e.g. lightningcss platform binary)
            # (Do not set `npm config optional`, it's deprecated in newer npm versions.)
            npm config delete omit || true
            npm config set fetch-retries 5
            npm config set fetch-retry-mintimeout 20000
            npm config set fetch-retry-maxtimeout 120000

            npm install --include=optional

            # Ensure lightningcss native binary is present (Tailwind v4 uses it).
            # On flaky networks, npm may continue even if optional platform binaries fail to download.
            if [ ! -f apps/web/node_modules/lightningcss/lightningcss.linux-x64-gnu.node ]; then
              echo "lightningcss native binary missing; attempting explicit install of linux binary package..."
              LCSS_VER=$(node -p "(require('./package-lock.json').packages && require('./package-lock.json').packages['node_modules/lightningcss-linux-x64-gnu'] && require('./package-lock.json').packages['node_modules/lightningcss-linux-x64-gnu'].version) || ''")
              if [ -n "$LCSS_VER" ]; then
                npm install --no-save --include=optional lightningcss-linux-x64-gnu@"$LCSS_VER"
              else
                npm install --no-save --include=optional lightningcss-linux-x64-gnu
              fi
            fi

            (cd apps/web && node -e "require('lightningcss'); console.log('lightningcss ok')")
            npm run build:api
            npm run build:web
            npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

            # Avoid EADDRINUSE on deploy if an old process is still holding the port
            pm2 delete rukunin-web || true
            pm2 delete rukunin-api || true

            if command -v lsof >/dev/null 2>&1; then
              kill -9 $(lsof -t -i:3000) 2>/dev/null || true
              kill -9 $(lsof -t -i:3001) 2>/dev/null || true
            elif command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
              fuser -k 3001/tcp 2>/dev/null || true
            fi

            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
