name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push to deploy branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build API
        # prisma generate is already in the build script: "prisma generate && nest build"
        run: npm run build:api

      - name: Build Web
        run: npm run build:web

      - name: Push artifacts to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SOURCE_SHA=$(git rev-parse --short HEAD)

          # Force-add build artifacts (excluded by .gitignore)
          # Exclude .next/cache — it's large and not needed at runtime
          find apps/web/.next -not -path '*/cache/*' -type f | xargs git add --force
          git add --force apps/api/dist/

          # Add prisma migrations (also excluded by .gitignore)
          git add --force apps/api/src/prisma/migrations/ 2>/dev/null || true

          # Ensure essential runtime config files are staged
          git add package.json package-lock.json ecosystem.config.js
          git add apps/web/package.json apps/api/package.json
          git add apps/api/src/prisma/schema.prisma
          git add start-web.sh start-api.sh 2>/dev/null || true

          git commit --allow-empty -m "deploy: ${SOURCE_SHA}"
          git push --force origin HEAD:refs/heads/deploy
