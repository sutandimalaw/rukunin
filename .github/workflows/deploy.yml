name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to IDCloudHost VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/rukunin

            # Prevent: "fatal: detected dubious ownership in repository"
            git config --global --add safe.directory /var/www/rukunin

            git pull origin main
            npm install
            npm run build:api
            npm run build:web
            npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

            # Avoid EADDRINUSE on deploy if an old process is still holding the port
            pm2 delete rukunin-web || true
            pm2 delete rukunin-api || true

            if command -v lsof >/dev/null 2>&1; then
              kill -9 $(lsof -t -i:3000) 2>/dev/null || true
              kill -9 $(lsof -t -i:3001) 2>/dev/null || true
            elif command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
              fuser -k 3001/tcp 2>/dev/null || true
            fi

            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
