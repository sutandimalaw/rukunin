name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to IDCloudHost VPS (with retry)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "SSH attempt ${attempt}/5..."
            if ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" \
              'bash -s' <<'EOF'
            set -euo pipefail
            cd /var/www/rukunin

            # Prevent: "fatal: detected dubious ownership in repository"
            git config --global --add safe.directory /var/www/rukunin

            # Always deploy the exact latest commit from origin/main
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            echo "Deployed commit: $(git rev-parse --short HEAD)"

            # Next.js can mis-detect workspace root when multiple lockfiles exist.
            # Ensure no nested lockfile remains on the server.
            rm -f apps/web/package-lock.json || true

            # Avoid reusing a partially-installed node_modules (common cause of missing native/optional bindings)
            rm -rf node_modules apps/web/node_modules apps/api/node_modules || true

            # Ensure optionalDependencies are installed (e.g. lightningcss platform binary)
            # (Do not set `npm config optional`, it's deprecated in newer npm versions.)
            npm config delete omit || true
            npm config set fetch-retries 5
            npm config set fetch-retry-mintimeout 20000
            npm config set fetch-retry-maxtimeout 120000

            # Prefer deterministic install (npm ci) but fallback to npm install if lock/workspaces mismatch.
            npm ci --include=optional || npm install --include=optional

            echo "Node: $(node -v) | npm: $(npm -v)"
            echo "Preflight: Tailwind Oxide (WASI)"
            (cd apps/web && NAPI_RS_FORCE_WASI=1 node -e "require('@tailwindcss/oxide'); console.log('oxide ok')")
            echo "Preflight: lightningcss (WASM)"
            (cd apps/web && CSS_TRANSFORMER_WASM=1 node -e "require('lightningcss'); console.log('lightningcss ok')")
            npm run build:api

            # VPS networking has been unstable, and native optional deps (Tailwind Oxide, lightningcss)
            # can fail to install reliably. Force WASM fallbacks during build to avoid native bindings.
            NAPI_RS_FORCE_WASI=1 CSS_TRANSFORMER_WASM=1 npm run build:web
            npx prisma migrate deploy --schema apps/api/src/prisma/schema.prisma

            # Avoid EADDRINUSE on deploy if an old process is still holding the port
            pm2 delete rukunin-web || true
            pm2 delete rukunin-api || true

            if command -v lsof >/dev/null 2>&1; then
              kill -9 $(lsof -t -i:3000) 2>/dev/null || true
              kill -9 $(lsof -t -i:3001) 2>/dev/null || true
            elif command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
              fuser -k 3001/tcp 2>/dev/null || true
            fi

            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
          EOF
            then
              echo "Deploy succeeded."
              exit 0
            fi

            echo "SSH attempt ${attempt} failed. Retrying..."
            sleep $((attempt * 5))
          done

          echo "Deploy failed after 5 SSH attempts."
          exit 1
