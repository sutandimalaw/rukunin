name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to IDCloudHost VPS (with retry)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "SSH attempt ${attempt}/5..."
            if ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o BatchMode=no \
              -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" \
              'bash -s' <<'EOF'
            set -euo pipefail
            cd /var/www/rukunin

            # Prevent: "fatal: detected dubious ownership in repository"
            git config --global --add safe.directory /var/www/rukunin

            # Always deploy the exact latest commit from origin/main
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            echo "Deployed commit: $(git rev-parse --short HEAD)"

            # Preflight: Check disk space
            DISK_USAGE=$(df /var/www/rukunin | tail -1 | awk '{print $5}' | sed 's/%//')
            echo "Disk usage: ${DISK_USAGE}%"
            if [ "${DISK_USAGE}" -gt 90 ]; then
              echo "ERROR: Disk usage >90%. Aborting."
              exit 1
            fi

            # Next.js can mis-detect workspace root when multiple lockfiles exist.
            rm -f apps/web/package-lock.json || true

            # Smart dependency management: only reinstall if package-lock.json changed
            NEEDS_INSTALL=false
            
            if [ ! -d "node_modules" ]; then
              echo "node_modules not found - will install"
              NEEDS_INSTALL=true
            elif git diff HEAD@{1} HEAD --name-only 2>/dev/null | grep -q "package-lock.json\|package.json"; then
              echo "Dependencies changed - will reinstall"
              NEEDS_INSTALL=true
            else
              echo "Dependencies unchanged - skipping install"
            fi

            if [ "$NEEDS_INSTALL" = true ]; then
              # Clean install for changed dependencies
              echo "Cleaning for fresh install..."
              rm -rf node_modules apps/web/node_modules apps/api/node_modules || true
              pkill -9 npm || true
              sleep 2

              npm config delete omit || true
              npm config set fetch-retries 5
              npm config set fetch-retry-mintimeout 20000
              npm config set fetch-retry-maxtimeout 120000

              echo "Installing dependencies (this may take several minutes)..."
              npm install --include=optional 2>&1 | grep -E '(added|removed|changed|audited|packages|WARN|ERR)' || echo "npm install in progress..."

              # CRITICAL: Explicitly install platform-specific native binaries
              echo "Installing platform-specific native binaries for Linux..."
              
              LCSS_VER=$(node -p "try { require('./apps/web/node_modules/lightningcss/package.json').version } catch(e) { '' }")
              OXIDE_VER=$(node -p "try { require('./apps/web/node_modules/@tailwindcss/oxide/package.json').version } catch(e) { '' }")
              
              if [ -n "${LCSS_VER}" ]; then
                echo "Installing lightningcss-linux-x64-gnu@${LCSS_VER}..."
                npm install --no-save --include=optional "lightningcss-linux-x64-gnu@${LCSS_VER}" || \
                  npm install --no-save --include=optional lightningcss-linux-x64-gnu@latest
              fi
              
              if [ -n "${OXIDE_VER}" ]; then
                echo "Installing @tailwindcss/oxide-linux-x64-gnu@${OXIDE_VER}..."
                npm install --no-save --include=optional "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VER}" || \
                  npm install --no-save --include=optional @tailwindcss/oxide-linux-x64-gnu@latest
              fi
            fi

            # Always verify native binaries exist before build
            echo "Verifying native binaries..."
            LCSS_BINARY="apps/web/node_modules/lightningcss/lightningcss.linux-x64-gnu.node"
            if [ ! -f "${LCSS_BINARY}" ]; then
              echo "ERROR: lightningcss native binary not found at ${LCSS_BINARY}"
              echo "Contents of apps/web/node_modules/lightningcss/:"
              ls -la apps/web/node_modules/lightningcss/ || echo "Directory not found"
              
              # Try to fix by reinstalling
              echo "Attempting to fix by reinstalling lightningcss..."
              npm install --no-save --include=optional lightningcss-linux-x64-gnu@latest
              
              if [ ! -f "${LCSS_BINARY}" ]; then
                echo "ERROR: Still missing after reinstall. Aborting."
                exit 1
              fi
            fi
            echo "✓ lightningcss native binary found"

            # Smart build: only rebuild what changed
            CHANGED_FILES=$(git diff HEAD@{1} HEAD --name-only 2>/dev/null || echo "all")
            
            NEEDS_API_BUILD=false
            NEEDS_WEB_BUILD=false
            
            if echo "$CHANGED_FILES" | grep -qE "^apps/api/|all"; then
              echo "API source changed - will rebuild API"
              NEEDS_API_BUILD=true
            fi
            
            if echo "$CHANGED_FILES" | grep -qE "^apps/web/|all"; then
              echo "Web source changed - will rebuild Web"
              NEEDS_WEB_BUILD=true
            fi
            
            # Always rebuild if dependencies changed (build artifacts may need updating)
            if [ "$NEEDS_INSTALL" = true ]; then
              echo "Dependencies changed - forcing full rebuild"
              NEEDS_API_BUILD=true
              NEEDS_WEB_BUILD=true
            fi

            # Build what's needed
            if [ "$NEEDS_API_BUILD" = true ]; then
              echo "Building API..."
              npm run build:api
            else
              echo "Skipping API build (no changes)"
            fi
            
            if [ "$NEEDS_WEB_BUILD" = true ]; then
              echo "Building Web (this may take 5-10 minutes)..."
              NAPI_RS_FORCE_WASI=1 npm run build:web
            else
              echo "Skipping Web build (no changes)"
            fi
            
            # Always run migrations (fast, idempotent)
            npx prisma migrate deploy --schema apps/api/src/prisma/schema.prisma

            # Restart apps
            echo "Restarting applications..."
            pm2 delete rukunin-web || true
            pm2 delete rukunin-api || true

            if command -v lsof >/dev/null 2>&1; then
              kill -9 $(lsof -t -i:3000) 2>/dev/null || true
              kill -9 $(lsof -t -i:3001) 2>/dev/null || true
            elif command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
              fuser -k 3001/tcp 2>/dev/null || true
            fi

            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
          EOF
            then
              echo "Deploy succeeded."
              exit 0
            fi

            echo "SSH attempt ${attempt} failed. Retrying in ${attempt}0 seconds..."
            sleep $((attempt * 10))
          done

          echo "Deploy failed after 5 SSH attempts."
          exit 1
